name: Deploy a Fly.io

# Despliega el bot automaticamente al hacer merge a main o develop.
#
# IMPORTANTE: el despliegue solo se ejecuta si el job de validacion pasa,
# para evitar que codigo roto reemplace el bot que esta en produccion.
#
# Para congelar los despliegues durante el fin de semana de calificacion,
# elimine "develop" (y si lo desea "main") de la lista de branches y deje
# unicamente el disparador manual workflow_dispatch.

on:
  push:
    branches: [main, develop]
    paths:
      - "Tarea3/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Evita que dos despliegues simultaneos se pisen entre si.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  validar:
    name: Validar antes de desplegar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Tarea3/requirements.txt

      - name: Instalar dependencias
        working-directory: Tarea3
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que todos los modulos compilan
        working-directory: Tarea3
        run: python -m compileall -q main.py config handlers

      - name: Ejecutar pruebas del modulo matematico
        working-directory: Tarea3
        run: python handlers/matematicas.py

      - name: Ejecutar pruebas del modulo de utilidades
        working-directory: Tarea3
        run: python handlers/utilidades.py

  desplegar:
    name: Desplegar a Fly.io
    needs: validar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Desplegar la aplicacion
        working-directory: Tarea3
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Mostrar el estado de las maquinas
        working-directory: Tarea3
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl status
